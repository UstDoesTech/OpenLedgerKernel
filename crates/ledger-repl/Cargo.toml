[package]
name = "ledger-repl"
version = "0.0.0"
description = "Pulls another cell's outbox and applies it here, in order, idempotently, in batches."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
ledger-store = { path = "../ledger-store", version = "0.0.0" }
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tokio-postgres = "0.7"

[lints]
workspace = true
