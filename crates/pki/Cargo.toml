[package]
name = "pki"
version = "0.0.0"
description = "Issues and rotates the API's certificates and cell credentials. The authority's key stays in a KMS that nobody can export; this signs through it and never holds it."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ledger_pki"
path = "src/lib.rs"

[[bin]]
name = "ledger-pki"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = "0.3"

[dev-dependencies]
api = { path = "../api", version = "0.0.0" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
tokio-postgres = "0.7"
ledger-core = { path = "../ledger-core", version = "0.0.0" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }

[lints]
workspace = true
