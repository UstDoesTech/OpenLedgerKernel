[package]
name = "control-plane"
version = "0.0.0"
description = "Leases, epochs and fences: the control plane interface and an in-memory implementation."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `tls-ring`: rustls with the ring provider, because aws-lc is not on the licence allow list.
etcd-client = { version = "0.21", optional = true, features = ["tls-ring"] }
ledger-core = { path = "../ledger-core", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
ledger-repl = { path = "../ledger-repl", version = "0.0.0" }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt", "time"] }
tokio-postgres = "0.7"

[features]
# The etcd control plane. Its client needs `protoc` to build, so the Neon conformance tests,
# which only need the orchestrator and the in-memory control plane, turn it off.
default = ["etcd"]
etcd = ["dep:etcd-client"]

[dev-dependencies]
ledger-store = { path = "../ledger-store", version = "0.0.0" }
proptest = "1"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util"] }

[lints]
workspace = true
