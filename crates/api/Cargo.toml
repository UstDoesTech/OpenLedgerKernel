[package]
name = "api"
version = "0.0.0"
description = "The ledger's HTTP API, run next to its own cell. Today a thin write path: opening accounts and, later, transfers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ledger_api"
path = "src/lib.rs"

[[bin]]
name = "ledger-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
control-plane = { path = "../control-plane", version = "0.0.0" }
ledger-core = { path = "../ledger-core", version = "0.0.0" }
ledger-store = { path = "../ledger-store", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
ring = "0.17"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "io-util", "sync"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http-body-util = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1", features = ["std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "password-hash"] }

[dev-dependencies]
ledger-check = { path = "../ledger-check", version = "0.0.0" }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
