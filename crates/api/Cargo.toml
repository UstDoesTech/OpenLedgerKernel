[package]
name = "api"
version = "0.0.0"
description = "The ledger's HTTP API, run next to its own cell. Today a thin write path: opening accounts and, later, transfers."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "ledger_api"
path = "src/lib.rs"

[[bin]]
name = "ledger-api"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
control-plane = { path = "../control-plane", version = "0.0.0" }
ledger-core = { path = "../ledger-core", version = "0.0.0" }
ledger-store = { path = "../ledger-store", version = "0.0.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
tokio-postgres = "0.7"
native-tls = "0.2"
postgres-native-tls = "0.5"

[dev-dependencies]
ledger-check = { path = "../ledger-check", version = "0.0.0" }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
