<path d="M 370 140 L 370 165 L 118 165 L 118 250" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M 450 140 L 450 250" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<path d="M 690 140 L 690 165 L 805 165 L 805 250" fill="none" stroke="#7b8794" stroke-width="2" marker-end="url(#a)"/>
<rect x="30" y="540" width="1000" height="50" rx="10" fill="#f3e8fb" stroke="#7a3fa0" stroke-width="2"/>
<text x="530" y="562" font-size="14" font-weight="700" text-anchor="middle" fill="#7a3fa0">Encrypted links between the clouds (site-to-site VPN)</text>
<text x="530" y="580" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">Carry replication pulls, lease checks and fence pushes. Nothing leaves the UK.</text>
<line x1="185" y1="520" x2="185" y2="540" stroke="#7b8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="530" y1="520" x2="530" y2="540" stroke="#7b8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<line x1="875" y1="520" x2="875" y2="540" stroke="#7b8794" stroke-width="2" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="530" y="624" font-size="13" font-weight="700" text-anchor="middle" fill="#7a3fa0">Control plane: five etcd members (two, two, one) hold each account's home and epoch, its lease and every fence</text>
<text x="530" y="644" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">Standby cells sit in another cloud. A cloud failure promotes standbys elsewhere, and the epoch fence keeps the old home out.</text>
<text x="530" y="674" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d" font-style="italic">Replication between cells: each cell pulls per account in (epoch, sequence) order, applies idempotently, buffers gaps, and quarantines superseded epochs.</text>
</svg>
