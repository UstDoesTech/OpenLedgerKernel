<text x="875" y="234" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">europe-west2 (London)</text>
<rect x="735" y="250" width="280" height="200" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
