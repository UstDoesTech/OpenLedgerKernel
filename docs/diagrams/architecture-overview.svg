<text x="530" y="234" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">uksouth</text>
<rect x="390" y="250" width="280" height="200" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
