<text x="942.0" y="312.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Primary</text>
<text x="875" y="356" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">synchronous standbys in other zones</text>
<rect x="748" y="366" width="120" height="38" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
