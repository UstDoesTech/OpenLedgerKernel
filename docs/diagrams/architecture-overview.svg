<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" width="1060" height="700" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Open Ledger Kernel: system overview</title><desc id="d">Clients call a tenant API. Each of three clouds in the UK runs ledger cells with synchronous standbys across availability zones. A five-member etcd control plane spans the clouds, and encrypted links join them.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#7b8794"/></marker></defs>
<rect width="1060" height="700" fill="#ffffff"/>
<text x="530" y="34" font-size="22" font-weight="700" text-anchor="middle" fill="#1f2933">Open Ledger Kernel: how it hangs together</text>
<text x="530" y="58" font-size="13" font-weight="400" text-anchor="middle" fill="#52606d">One tenant, three UK clouds. Every account has one home cell; entries are append-only and replicate by pull.</text>
<rect x="330" y="78" width="400" height="62" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="530.0" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Commands and queries</text>
<text x="530.0" y="120" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">Tenant comes from the token. Idempotency key on every command</text>
<rect x="30" y="190" width="310" height="330" rx="12" fill="#fff4e5" stroke="#c26a00" stroke-width="2"/>
<text x="185" y="216" font-size="17" font-weight="700" text-anchor="middle" fill="#c26a00">AWS</text>
<text x="185" y="234" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">eu-west-2 (London)</text>
<rect x="45" y="250" width="280" height="200" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5" stroke-dasharray="5 4"/>
<text x="185" y="270" font-size="13" font-weight="700" text-anchor="middle" fill="#1f2933">Cell: one Postgres primary</text>
<rect x="58" y="282" width="120" height="50" rx="8" fill="#fff4e5" stroke="#c26a00" stroke-width="1.5"/>
<text x="118.0" y="312.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">API + node agent</text>
<rect x="192" y="282" width="120" height="50" rx="8" fill="#fff4e5" stroke="#c26a00" stroke-width="1.5"/>
<text x="252.0" y="312.0" font-size="14" font-weight="700" text-anchor="middle" fill="#1f2933">Primary</text>
<text x="185" y="356" font-size="12" font-weight="400" text-anchor="middle" fill="#52606d">synchronous standbys in other zones</text>
<rect x="58" y="366" width="120" height="38" rx="8" fill="#f5f7fa" stroke="#9aa5b1" stroke-width="1.5"/>
<text x="118.0" y="390.0" font-size="12" font-weight="700" text-anchor="middle" fill="#1f2933">Standby, zone b</text>
