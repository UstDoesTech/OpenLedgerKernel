- id: K-17
  title: Issue and rotate the API's certificates and cell credentials
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-13
  - S-07
  decisions:
  - D-17
  deliverables:
  - crates/pki
  - crates/api/src/reload.rs
  - infra/envs/europe/authority
  - scripts/rotation_manifest.py
  - .github/workflows/rotate-credentials.yml
  - docs/runbooks/rotating-credentials.md
  acceptance:
  - One command, run by a credentialed workflow and never by hand, issues for each cell a server certificate,
    a client certificate for etcd and the cell credentials, and writes them into that cell's API secret as
    a new version. The files and entries are those listed by the API module's secret_files output.
  - Certificates last 30 days and are re-issued every 10. Cell credentials are re-issued every 7 days and
    on demand. The service reads its files again when they change, so a rotation needs no restart and
    drops no request, shown by a test that rotates while transfers are running.
  - A cell credential that the other side no longer lists is refused, and a removed cell stops being
    accepted as soon as the lists are pushed, which an on-demand run does, each with a test.
  - A run prints counts only, so no certificate, key, token or identifier reaches a log, with a test that
    fails if a step prints one.
  - If a rotation fails part-way the old files stay in force and the run fails loudly. The runbook says how
    to recover.
  notes: Edits a credentialed workflow, so it needs a person's review. D-17 is decided, so the signer is the
    AWS KMS one, and the in-memory one is kept for tests and rehearsals. The run is started by a person, once a
    week, because credentialed workflows run only by dispatch. One run makes both, so certificates are re-issued
    every 7 days, inside the 10 days the decision allows.
  refs:
  - docs/credentialed-workflows.md
