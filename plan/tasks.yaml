# Task graph for the open ledger kernel. Source of truth for what to build, in what order, and how
# "done" is judged. docs/implementation-plan.md renders from this file:
#   python plan/render.py          # rewrite the generated sections
#   python plan/render.py --check  # CI: fail if the doc is out of date
#
# Rules for agents are in AGENTS.md. In short: pick a task whose status is todo, whose
# depends_on are all done and which no open PR already claims; claim it with a draft PR
# titled "[<id>] <title>"; finish when every acceptance line is true and CI is green.
#
# status: todo | in_progress | blocked | done
# size:   S (about a day of focused agent work), M (several days), L (split before starting)
# owner:  agent (default) or human; human tasks are never claimed by agents
# decisions: ids from the decisions list that must be "decided" before the vendor- or
#   policy-specific part can ship. Until then, build behind an interface with the proposed
#   default as an in-memory or simulated implementation (see AGENTS.md).
# refs: design sections, as repo-relative paths with GitHub heading anchors.
#
# The commercial add-on (command engine, products, payments, agents, data, console, launch) is
# planned in a separate private repository and starts from the release GATE-1 tags.

version: 1
phases:
- id: P1
  name: Stable open kernel
  goal: Turn the reference implementation into a production-grade Rust ledger kernel, prove it on real
    UK clouds with real network faults, and put a thin write path on it, so that it can be released as
    a stable open-source kernel.
  gate: GATE-1
workstreams:
  F: Foundation
  K: Ledger kernel
  R: Replication
  C: Control plane and failover
  T: Testing and fault injection
  I: Infrastructure
  S: Security and compliance
  GATE: Gates
decisions:
- id: D-02
  title: Managed Postgres service per cloud, and whether Lakebase is available in the UK regions needed
  status: decided
  proposed: Each cloud's managed PostgreSQL 16 service, Lakebase where Databricks runs; Neon for development
  outcome: Any vanilla PostgreSQL 16 will do, with no extensions and no logical replication slots, whether
    managed on any cloud, self-hosted or Neon for development. Lakebase is the default where Databricks
    runs. The product does not matter. (Ust Oldfield, 2026-11-14)
- id: D-03
  title: Control plane technology across three clouds
  status: decided
  proposed: etcd v3, five members spread over the three clouds
  outcome: etcd v3, five members spread over the three clouds by default. It must also run with a minimum
    of three members, because some geographies have only one region. (Ust Oldfield, 2026-11-14)
- id: D-14
  title: Latency budget - same-cell leg, cross-cell transfer and strong-tier acknowledgement, p50 and
    p95
  status: open
  proposed: null
- id: D-16
  title: Where the credentialed workflows run once the code is public
  status: decided
  proposed: The private repository runs them against a pinned commit of the public one, so logs, secrets
    and cloud trust stay private
  outcome: The credentialed workflows run on the public repository. Its workflow logs are readable by
    anyone, so S-07's guards are required, not optional. That means no plan output or identifiers in a
    log, dispatch only from main, a named approver, and cloud trust pinned to that repository's environment.
    (Ust Oldfield, 2026-11-19)
- id: D-17
  title: Where the certificate authority's key lives
  status: decided
  proposed: One central authority, held in AWS. Its key is in a KMS that the signer can use but nobody can
    export. Certificates last 30 days and are re-issued every 10, so the signer can be down for about 20
    days without any cell losing the others. Cell credentials are re-issued every 7 days, and when a cell
    is removed. Every cell trusts the authority's public certificate, so no cell calls AWS to check one
  outcome: One central authority, held in AWS, not one per cloud. Its key is in a KMS that the signer can use
    but nobody can export. Certificates last 30 days and are re-issued every 10. Cell credentials are
    re-issued every 7 days, and when a cell is removed. Every cell trusts the authority's public certificate,
    so no cell calls AWS to check one. (Ust Oldfield, 2026-11-20)
- id: D-18
  title: How the rotation identities are made, and who may make them
  status: decided
  proposed: OpenTofu makes them, in a layer of its own applied by infra-apply. In AWS the role and its
    policy, in Azure the app registration, its federated credential and the role assignments, and in Google
    Cloud the service account, its provider binding and its roles. Each trust names this repository's
    rotate-credentials environment only. The applying identity may create only these identities, bounded
    by a permissions boundary in AWS, a custom role in Azure and a deny policy in Google Cloud, so it cannot
    grant itself or the new identities more than the layer lists. Entering the values as the environment's
    secrets stays a person's step, because OpenTofu holds no GitHub token.
  outcome: OpenTofu makes the rotation identities, in a layer applied by infra-apply. The applying identity may
    create only those identities, bounded by a permissions boundary in AWS, a custom role in Azure and a
    deny policy in Google Cloud. Entering the outputs as the environment's secrets stays a person's step.
    (Ust Oldfield, 2026-11-20)
- id: D-19
  title: Which database credential the API uses, and who writes it
  status: decided
  proposed: A dedicated application role per cell, made by the node agent on the primary's first start. The
    agent writes that role's connection string into the cell's API secret itself, so neither the run nor a
    person ever reads the administrator's credential. Until the agent does this, the run copies the
    administrator's connection into db.conn, for proving environments only.
  outcome: A dedicated application role per cell, made by the node agent on the primary's first start, which
    writes that role's connection string into the cell's API secret. Until then the run copies the
    administrator's connection into db.conn, for proving environments only. (Ust Oldfield, 2026-11-20)
