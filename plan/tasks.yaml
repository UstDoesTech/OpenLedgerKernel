  notes: K-17 sets the cells' etcd-ca.crt to the authority's certificate, so etcd must trust it. Until this
    task, the members' certificates are made by hand from that authority. Edits a credentialed workflow
    and may change an AWS or Azure role, so it needs a person's review.
  refs:
  - docs/credentialed-workflows.md
- id: K-19a
  title: Let the API trust a database CA, and make the first start say why it cannot connect
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-17
  deliverables:
  - crates/api
  - crates/pki
  - infra/modules/api-boot
  - docs/runbooks/rotating-credentials.md
  acceptance:
  - The API reads an optional db-ca.crt entry from its secret and trusts that CA, as well as the system
    roots, when it connects to its cell's database. The API connects once, at start, so a changed file
    applies at the next start, which the refresh timer's service does not trigger.
  - A test against a Postgres node with TLS shows the connection works with the right CA, fails with
    another, and that a refused change keeps the old connector.
  - A start that cannot reach its database logs one line saying whether the cause was the name, the
    certificate or the sign-in, and no host, user or password.
  - The rotation writes db-ca.crt when the manifest gives one, and keeps it when it does not.
  notes: The API has no reconnect, so reloading a CA would change nothing. A reconnecting database client is
    a separate task. The API checks the database certificate against the system roots only, and the cells' nodes use
    their own CA, so the first real connection is expected to fail without this. Edits a credentialed
    workflow's inputs, so it needs a person's review.
  refs:
  - docs/credentialed-workflows.md
- id: K-19b
  title: Fill each API secret's database connection and the proving tenant's tokens
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-19a
  decisions:
  - D-19
  deliverables:
  - crates/pki
  - crates/api
  - scripts/rotation_manifest.py
  - .github/workflows/rotate-credentials.yml
  - docs/runbooks/rotating-credentials.md
  acceptance:
  - A run writes db.conn and tokens.json into each cell's API secret when they are absent, and leaves them
    alone when present, so no entry of the secret is filled by hand. The connection string names only that
    cell's own database, and no cell's secret holds another cell's.
  - The tokens are made fresh for the proving tenant by the run and are not in the repository, a log or the
    state, with a test that fails if a step prints one. A person can read one with their own sign-in.
  - The database credential comes from a trait. The only real source until K-19d is the administrator
    copy, switched on by a manifest field that proving environments set and refused otherwise.
  - A token that was issued is refused once a later run no longer lists it, shown by a test against the
    running service.
  notes: Until this task a person fills these two entries with the scripts in the first-entry runbook. Real
    sign-in replaces the tokens in A-06. Edits a credentialed workflow and may add a read permission on
