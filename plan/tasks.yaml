- id: K-01
  title: Ledger domain types
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - F-01
  deliverables:
  - crates/ledger-core
  acceptance:
  - Money is integer minor units plus an ISO 4217 code; no floating point anywhere in the crate.
  - Typed, prefixed identifiers for tenant, account, journal, entry, hold, command and party.
  - Journal construction refuses any journal whose entries do not net to zero per currency (property test
    with proptest).
  - The crate has no I/O dependencies.
  refs:
  - docs/design.md#data-model
  - docs/api-design.md#conventions
- id: K-02
  title: Schema v1 migrations
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - F-02
  - K-01
  deliverables:
  - crates/ledger-store/migrations
  acceptance:
  - Tables for tenant-scoped accounts, journals, entries, holds, epoch fences, quarantine, in-transit
    accounts and the outbox; every table carries tenant_id.
  - Every constraint in schema.sql is preserved, including unique (account, epoch, seq) and unique (journal,
    account, leg).
  - Migrations apply cleanly to an empty database and are idempotent on re-run.
  - No column can hold names, addresses, card numbers or free-text payment references.
  refs:
  - docs/design.md#data-model
  - schema.sql
- id: K-03
  title: Single-round-trip ledger leg
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-02
  deliverables:
  - crates/ledger-store
  acceptance:
  - Posting a leg (lock, fence check, available-balance check, entry insert, projection update, outbox
    write) is one SQL call and returns the watermark.
  - 20 concurrent debits of 10 against a balance of 100 from three clients yield exactly 10 successes.
  - Reusing a journal id with a different amount is rejected; repeating it with the same amount returns
    the original entry.
  - A writer holding a stale epoch is rejected by the database.
  refs:
  - docs/design.md#write-path-performance
  - docs/design.md#cells-homes-and-epochs
- id: K-04
  title: Cross-cell journals through in-transit accounts
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-03
  deliverables:
  - crates/ledger-store
  acceptance:
  - A cross-cell transfer posts payer-to-in-transit on the payer's cell and in-transit-to-payee on the
    payee's cell.
  - Each cell's trial balance is zero when sampled mid-flight during a concurrent workload.
  - A crash between legs is completed exactly once by recovery; in-transit accounts drain to zero.
  - A journal declined at the first leg writes nothing.
  refs:
  - docs/design.md#journals-across-cells
- id: K-05
  title: Holds and available balance
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-03
  deliverables:
  - crates/ledger-store
  acceptance:
  - Holds can be placed, released, converted to a journal and expired; each transition is idempotent.
  - Available balance equals posted minus active holds plus arranged overdraft, and every debit authorises
    against it.
  refs:
  - docs/design.md#data-model
- id: K-06
  title: Invariant checker
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-02
  deliverables:
  - crates/ledger-check
  - crates/ledgerctl (check subcommand)
  acceptance:
  - Checks every invariant in ledger/checks.py plus cell trial balance and in-transit age.
  - ledgerctl check exits non-zero and names the account or cell when any invariant fails.
  refs:
  - docs/design.md#invariants-checked-continuously
  - ledger/checks.py
- id: K-07
  title: ISO 4217 currency list, refreshable from the official source
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-01
  deliverables:
  - crates/ledger-core/data/iso4217.csv
  - scripts/refresh_iso4217.py
  - .github/workflows/iso4217.yml
  acceptance:
  - Currency parsing accepts only codes on the embedded ISO 4217 list, and exposes numeric code and minor-unit
