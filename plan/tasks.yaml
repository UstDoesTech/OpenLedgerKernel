    as the cells' certificates, naming the member's address, and writes them with the authority's
    certificate into that member's secret as a new version. The files are those the etcd module lists.
  - Members and cells trust the same authority, shown by a test in which a cell's etcd client certificate
    from a K-17 rotation is accepted by an etcd member started with the certificates this task issues,
