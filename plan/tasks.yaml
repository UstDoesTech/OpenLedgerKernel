  refs:
  - tests/test_active_active.py
  - docs/conformance.md
- id: T-02
  title: Real network fault injection
  phase: P1
  workstream: T
  size: M
  status: done
  depends_on:
  - T-01
  - C-02
  deliverables:
  - crates/conformance
  acceptance:
  - Using Toxiproxy, scenarios cut a home from its peers and the control plane, cut only the control plane,
    add 200 ms latency and drop packets.
  - Serving continues on valid leases when only the control plane is cut.
  - Every invariant holds after each scenario settles.
  refs:
  - docs/design.md#failover
- id: K-08
  title: Node-side lease guard
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - C-02
  - T-02
  deliverables:
  - crates/control-plane
  acceptance:
  - A node confirms its lease with the control plane before it serves an account, and refuses when the
    lease has lapsed or the node is not home.
  - While the control plane is unreachable, a node keeps serving an account on the last lease it confirmed,
    timed locally from when it last renewed, and stops before the control plane could let the lease lapse.
  - A node that cannot reach the control plane reports it as unavailable, never as a lost lease.
  - The T-02 network scenarios assert this guard, with the control plane cut for shorter and longer than
    the ttl.
  refs:
  - docs/design.md#failover
- id: K-09
  title: Recover cross-cell journals by current home
  phase: P1
  workstream: K
  size: S
  status: todo
  depends_on:
  - T-03
  deliverables:
  - crates/ledger-store
  - crates/conformance
  acceptance:
  - Recovery finishes a cross-cell journal at the payee's current home, even when the payee failed over
    after the send, and acts only on journals for the cell it is given.
  - The receiving in-transit account and epochs come from the cell that does the receive, so the pair
    of in-transit accounts still nets to zero.
  - The randomised runs (T-03) fail an account over while a transfer to it is in flight, and the harness
    no longer skips those failovers or needs its own recovery loop.
  refs:
  - docs/design.md#journals-across-cells
- id: K-10
  title: Generalise the ledger kernel's vocabulary
  phase: P1
  workstream: K
  size: M
  status: todo
  depends_on:
  - T-03
  deliverables:
  - crates/ledger-core
  - crates/conformance
  - docs/kernel.md
  acceptance:
  - The kernel can hold a unit that is not a currency (points, kWh, shares) with a declared scale, alongside
