  - Tests of these properties, in the style of tests/test_publish_images_workflow.py. docs/credentialed-workflows.md
    says how to run it and how to read the digest.
  notes: The digest is only known after the build, so it goes into infra/images.json in a later pull request
    (I-01u). I-01i said a person publishes the image; this makes that one command.
  refs:
  - docs/credentialed-workflows.md
  - images/postgres/README.md
