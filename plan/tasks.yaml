  - AGENTS.md
  acceptance:
  - A manually dispatched workflow plans and applies one layer of one environment under infra/envs, and
    is the only way an apply runs from GitHub. It never runs from a push or a pull request, and agents
    never dispatch it.
  - The apply job runs in a GitHub Environment that needs a person's approval and only runs from main.
    It re-plans, refuses to apply if the plan differs from the one the plan job showed, and applies the
    saved plan.
  - No cloud secret is stored in GitHub. Each cloud trusts GitHub's identity token (AWS, Azure and Google
    Cloud federation); the plan job uses read-only roles and never takes the state lock.
  - Sensitive inputs reach the run as TF_VAR_ secrets of the apply environment. No secret is in the repository,
    the logs or an artefact, and the plan file is never uploaded.
  - docs/credentialed-workflows.md gives each cloud's one-time setup for the federation, the two environments,
    the variables and secrets, and how to revoke access.
  - AGENTS.md names this workflow as the one route for applying, and still bars agents from running tofu
    apply, using cloud credentials, or dispatching it. The change is made by a pull request labelled needs-human.
  notes: A person chose a gated workflow over applying by hand on 16 November 2026. It does not change
    I-01f, which a person still owns and approves.
