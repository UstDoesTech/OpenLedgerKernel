- id: K-01
  title: Ledger domain types
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - F-01
  deliverables:
  - crates/ledger-core
  acceptance:
  - Money is integer minor units plus an ISO 4217 code; no floating point anywhere in the crate.
  - Typed, prefixed identifiers for tenant, account, journal, entry, hold, command and party.
  - Journal construction refuses any journal whose entries do not net to zero per currency (property test
    with proptest).
  - The crate has no I/O dependencies.
  refs:
  - docs/design.md#data-model
  - docs/api-design.md#conventions
- id: K-02
  title: Schema v1 migrations
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - F-02
  - K-01
  deliverables:
  - crates/ledger-store/migrations
  acceptance:
  - Tables for tenant-scoped accounts, journals, entries, holds, epoch fences, quarantine, in-transit
    accounts and the outbox; every table carries tenant_id.
  - Every constraint in schema.sql is preserved, including unique (account, epoch, seq) and unique (journal,
    account, leg).
  - Migrations apply cleanly to an empty database and are idempotent on re-run.
  - No column can hold names, addresses, card numbers or free-text payment references.
  refs:
  - docs/design.md#data-model
  - schema.sql
- id: K-03
  title: Single-round-trip ledger leg
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-02
  deliverables:
  - crates/ledger-store
  acceptance:
  - Posting a leg (lock, fence check, available-balance check, entry insert, projection update, outbox
    write) is one SQL call and returns the watermark.
  - 20 concurrent debits of 10 against a balance of 100 from three clients yield exactly 10 successes.
  - Reusing a journal id with a different amount is rejected; repeating it with the same amount returns
    the original entry.
  - A writer holding a stale epoch is rejected by the database.
  refs:
  - docs/design.md#write-path-performance
  - docs/design.md#cells-homes-and-epochs
- id: K-04
  title: Cross-cell journals through in-transit accounts
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-03
  deliverables:
  - crates/ledger-store
  acceptance:
  - A cross-cell transfer posts payer-to-in-transit on the payer's cell and in-transit-to-payee on the
    payee's cell.
  - Each cell's trial balance is zero when sampled mid-flight during a concurrent workload.
  - A crash between legs is completed exactly once by recovery; in-transit accounts drain to zero.
  - A journal declined at the first leg writes nothing.
  refs:
  - docs/design.md#journals-across-cells
- id: K-05
  title: Holds and available balance
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-03
  deliverables:
  - crates/ledger-store
  acceptance:
  - Holds can be placed, released, converted to a journal and expired; each transition is idempotent.
  - Available balance equals posted minus active holds plus arranged overdraft, and every debit authorises
    against it.
  refs:
  - docs/design.md#data-model
- id: K-06
  title: Invariant checker
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-02
  deliverables:
  - crates/ledger-check
  - crates/ledgerctl (check subcommand)
  acceptance:
  - Checks every invariant in ledger/checks.py plus cell trial balance and in-transit age.
  - ledgerctl check exits non-zero and names the account or cell when any invariant fails.
  refs:
  - docs/design.md#invariants-checked-continuously
  - ledger/checks.py
- id: K-07
  title: ISO 4217 currency list, refreshable from the official source
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-01
  deliverables:
  - crates/ledger-core/data/iso4217.csv
  - scripts/refresh_iso4217.py
  - .github/workflows/iso4217.yml
  acceptance:
  - Currency parsing accepts only codes on the embedded ISO 4217 list, and exposes numeric code and minor-unit
    exponent.
  - scripts/refresh_iso4217.py rebuilds the embedded list from SIX Group's List One (the ISO 4217 maintenance
    agency), validates it, and changes nothing when the published list is unchanged.
  - A workflow runs the script monthly and on demand, and opens a pull request with added and removed
    codes when the list changes.
  - The embedded data records whether it came from the official source or is a provisional seed.
  refs:
  - docs/api-design.md#conventions
  - docs/design.md#data-model
- id: C-01
  title: Control plane interface and in-memory implementation
  phase: P1
  workstream: C
  size: S
  status: done
  depends_on:
  - K-01
  deliverables:
  - crates/control-plane
  acceptance:
  - A trait covering register, home lookup, lease check, heartbeat, expire, renew, promote and fence listing.
  - The in-memory implementation reproduces ledger/control.py including heartbeat renewal; a forced expiry
    is never revived by the heartbeat.
  refs:
  - docs/design.md#cells-homes-and-epochs
  - ledger/control.py
- id: C-02
  title: etcd control plane
  phase: P1
  workstream: C
  size: M
  status: done
  depends_on:
  - C-01
  - F-02
  decisions:
  - D-03
  deliverables:
  - crates/control-plane
  acceptance:
  - Leases, epochs and fences are stored in etcd with compare-and-swap on epoch.
  - Nodes watch fences and install them; a node that cannot reach etcd stops renewing and loses its lease.
  - The trait's test suite passes against both implementations.
  refs:
  - docs/design.md#failover
- id: R-01
  title: Outbox relay and batched apply
  phase: P1
  workstream: R
  size: M
  status: done
  depends_on:
  - K-03
  deliverables:
  - crates/ledger-repl
  acceptance:
  - Entries ship per account in (epoch, seq) order and apply idempotently in batches, one round trip per
    batch.
  - A gap is buffered and re-fetched, never skipped; redelivery applies nothing twice.
  - Each home publishes a per-cell watermark even when idle.
  refs:
  - docs/design.md#replication
- id: R-02
  title: Fencing and quarantine on apply
  phase: P1
  workstream: R
  size: M
  status: done
  depends_on:
  - R-01
  - C-01
  deliverables:
  - crates/ledger-repl
  - crates/ledger-store/migrations
  acceptance:
  - The void rule from ledger/node.py is enforced in SQL on every node.
  - Entries from a superseded epoch beyond its cutoff move to quarantine, with the projection reversed,
    whether written locally or received.
  - Quarantined entries are never merged silently.
  refs:
  - docs/design.md#failover
  - ledger/node.py
- id: R-03
  title: Strong durability tier
  phase: P1
  workstream: R
  size: S
  status: done
  depends_on:
  - R-01
  deliverables:
  - crates/ledger-repl
  acceptance:
  - A strong write returns only after a remote cell has applied it; if no acknowledgement arrives in time,
    the caller gets durability_not_met and a retry with the same key completes it without double-posting.
  refs:
  - docs/design.md#durability-tiers
- id: C-03
  title: Failover orchestrator
  phase: P1
  workstream: C
  size: M
  status: done
  depends_on:
  - C-01
  - R-02
  deliverables:
  - crates/control-plane
  - crates/ledgerctl (promote, drain subcommands)
  acceptance:
  - Promotion reads the standby's high-water mark, issues epoch+1 with that cutoff and pushes the fence
    to every reachable node.
  - Draining routes new requests away from a cell without stopping in-flight commits.
  - Promotion of a level standby finishes inside 15 seconds on the local environment.
  refs:
  - docs/design.md#failover
- id: T-01
  title: Conformance suite ported from the harness
  phase: P1
  workstream: T
  size: M
  status: done
  depends_on:
  - K-04
  - K-05
  - K-06
  - R-02
  - R-03
  - C-03
  deliverables:
  - crates/conformance
  - scripts/mutation_check.sh
  - docs/conformance.md
  acceptance:
  - Every scenario in tests/test_active_active.py has a Rust equivalent that passes against three local
    nodes, including both failover drills.
  - A documented mutation script shows the suite fails when fencing or the account row lock is disabled.
  - After parity, the Python harness is marked as the reference implementation in README.md and no longer
    extended.
  refs:
  - tests/test_active_active.py
  - docs/conformance.md
- id: T-02
  title: Real network fault injection
  phase: P1
  workstream: T
  size: M
  status: done
  depends_on:
  - T-01
  - C-02
  deliverables:
  - crates/conformance
  acceptance:
  - Using Toxiproxy, scenarios cut a home from its peers and the control plane, cut only the control plane,
    add 200 ms latency and drop packets.
  - Serving continues on valid leases when only the control plane is cut.
  - Every invariant holds after each scenario settles.
  refs:
  - docs/design.md#failover
- id: K-08
  title: Node-side lease guard
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - C-02
  - T-02
  deliverables:
  - crates/control-plane
  acceptance:
  - A node confirms its lease with the control plane before it serves an account, and refuses when the
    lease has lapsed or the node is not home.
  - While the control plane is unreachable, a node keeps serving an account on the last lease it confirmed,
    timed locally from when it last renewed, and stops before the control plane could let the lease lapse.
  - A node that cannot reach the control plane reports it as unavailable, never as a lost lease.
  - The T-02 network scenarios assert this guard, with the control plane cut for shorter and longer than
    the ttl.
  refs:
  - docs/design.md#failover
- id: K-09
  title: Recover cross-cell journals by current home
  phase: P1
  workstream: K
  size: S
  status: todo
  depends_on:
  - T-03
  deliverables:
  - crates/ledger-store
  - crates/conformance
  acceptance:
  - Recovery finishes a cross-cell journal at the payee's current home, even when the payee failed over
    after the send, and acts only on journals for the cell it is given.
  - The receiving in-transit account and epochs come from the cell that does the receive, so the pair
    of in-transit accounts still nets to zero.
  - The randomised runs (T-03) fail an account over while a transfer to it is in flight, and the harness
    no longer skips those failovers or needs its own recovery loop.
  refs:
  - docs/design.md#journals-across-cells
- id: K-10
  title: Generalise the ledger kernel's vocabulary
  phase: P1
  workstream: K
  size: M
  status: todo
  depends_on:
  - T-03
  deliverables:
  - crates/ledger-core
  - crates/conformance
  - docs/kernel.md
  acceptance:
  - The kernel can hold a unit that is not a currency (points, kWh, shares) with a declared scale, alongside
    Money. Money stays integer minor units plus an ISO 4217 code, with no floating point, and every existing
    K-01 test passes unchanged.
  - The kernel crates and docs/kernel.md name no bank-specific concept (payer, payee, sort code, scheme);
    banking vocabulary lives in layers above the kernel or is documented as an alias.
  - Two examples run on the kernel with no banking terms, a general-ledger book and a points scheme, and
    both pass the conformance invariants.
  - docs/kernel.md says what the kernel does not do (chart of accounts, dimensions, period close, revaluation,
    multiple books) and where those belong.
  - Every existing conformance test and acceptance line passes unchanged. A change that would loosen one
    is opened as a pull request labelled needs-human.
  refs:
  - docs/design.md#data-model
- id: K-11
  title: Write path skeleton, the API service and opening accounts
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-03
  - K-08
  deliverables:
  - crates/api
  acceptance:
  - A service in crates/api starts next to one cell, reads the cell's database and the control plane,
    and answers a health check that says whether the cell holds its leases.
  - Every request carries a bearer token and the tenant comes only from the token, through an Authenticator
    trait with an in-memory implementation for tests and the proving environment. A tenant in a path or
    body is refused, and a token for one tenant never reads or writes another's accounts.
  - POST /v1/accounts opens an account for the token's tenant with a currency and an overdraft
    allowance (every account opened here is a customer account; kinds arrive with the product work), at its home cell and current epoch, and is safe to repeat with the same Idempotency-Key.
  - Errors are problem+json with a stable code for each refusal the kernel can give.
  - The service refuses to serve an account whose home is another cell or whose lease the guard cannot
    confirm, and says which, so a caller can go to the right place.
  - These behaviours are proven in CI against three real Postgres nodes and etcd (make up), including
    a second tenant's token and a node that loses its lease.
  notes: A walking skeleton, ahead of GATE-1 on the owner's say. It is thin on purpose. Authentication,
    the command catalogue, simulate and commit, and policy are A-01 to A-06 and replace its stand-ins
    one at a time, so nothing here is thrown away. Tenants come from tokens, never paths or bodies.
  refs:
  - docs/design.md#cells-homes-and-epochs
  - docs/api-design.md#identity-and-authorisation
- id: K-12
  title: Write path skeleton, transfers over HTTP
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-11
  - K-04
  - K-05
  deliverables:
  - crates/api
  - api/openapi.yaml
  acceptance:
  - POST /v1/transfers moves an amount between two of the tenant's accounts with an Idempotency-Key, and
    returns the journal id, the watermark at each cell and whether it was a repeat.
  - A transfer between accounts on one cell posts through the kernel's single-call leg. A transfer between
    two cells goes through the in-transit accounts, and a crash between its legs is finished exactly once
    by recovery.
  - Repeating a request with the same key and body returns the original result and writes nothing. The
    same key with a different body is refused with an idempotency conflict.
  - A decline (funds, currency, unknown account, stale epoch, wrong home) writes nothing and says why
    in problem+json.
  - Twenty concurrent debits of 10 against a balance of 100 through the service yield exactly 10 successes,
    and the invariant checker passes on every cell afterwards.
  - There is no endpoint that updates or deletes an entry. A correction is a new journal.
  - Money in requests and responses is integer minor units plus an ISO 4217 code, with no floating point
    anywhere.
  - api/openapi.yaml describes both paths and a test fails if the service and the file disagree.
  notes: Two accounts and one amount, no products, no approvals, no policy. Each of those arrives as the
    command catalogue (A-01) and the simulate and commit engine (A-02), which wrap this path.
  refs:
  - docs/design.md#journals-across-cells
  - docs/api-design.md#errors-idempotency-and-retries
- id: K-14
  title: Write path skeleton, cells call each other for cross-cell transfers
  phase: P1
  workstream: K
  size: M
  status: done
  depends_on:
  - K-12
  deliverables:
  - crates/api
  - api/internal.md
  acceptance:
  - A cross-cell transfer is made by the payer's service calling the payee cell's service for the second
    half, over an internal endpoint, and never by connecting to another cell's database. The service
    takes no connection string for any cell but its own, and refuses to start if LEDGER_PEERS_FILE
    (added in K-12) is set.
  - An internal call carries a credential that names the calling cell and the tenant, checked by an
    Authenticator-style trait with an in-memory implementation for tests. A call without one, with one
    for another cell, or naming a tenant the credential does not cover is refused, and a tenant token is
    never accepted on an internal endpoint.
  - The payee's cell prepares its own side of the in-transit pair, checks the payee exists for the
    tenant and is in the amount's currency, and credits it. A decline there is returned to the payer's
    cell before anything was written at either cell, so the first half is never stranded.
  - Every K-12 behaviour still holds, proven by the same tests, with the peer database connections removed
    from them. A crash between the legs is finished exactly once by a retry or by recovery, and the same
    holds when the payee's cell is unreachable for a while.
  - The internal endpoints are not in api/openapi.yaml. They are described in api/internal.md, and a
    test fails if that file and the service disagree.
  - Internal calls between cells use mutual TLS, so a peer is known by its certificate as well as its
    credential. A test starts the service on a non-loopback address without TLS configured and expects
    it to refuse.
  notes: Keeps one database secret per machine identity, so K-13 can give each API a role that reads its own
    cell's secret and nothing else. The internal endpoints are private to the cells' network, which K-13
    enforces. K-12 connects to peer databases directly, which is what this replaces.
  refs:
  - docs/design.md#journals-across-cells
  - docs/api-design.md#identity-and-authorisation
- id: K-15
  title: The API reaches etcd over mutual TLS
  phase: P1
  workstream: K
  size: S
  status: done
  depends_on:
  - K-14
  deliverables:
  - crates/control-plane
  - crates/api
  acceptance:
  - The control plane's etcd client takes a certificate authority, a client certificate and a key, as files,
    and the service reads them from LEDGER_ETCD_CA_FILE, LEDGER_ETCD_CERT_FILE and LEDGER_ETCD_KEY_FILE.
  - The service refuses to start if an etcd endpoint is https and any of the three is missing, or if one is
    set and an endpoint is plain http on a non-loopback address.
  - A test starts etcd with --client-cert-auth and proves the service connects with a valid certificate and
    is refused without one. The existing plain-http tests still pass on loopback.
  notes: The etcd module requires client certificates and TLS 1.3, but the service has no way to present
    one, so no API on an applied environment can reach etcd. K-13 cannot give a person a first entry
    without this.
  refs:
  - docs/design.md#failover
