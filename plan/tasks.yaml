  refs:
  - docs/design.md#cells-homes-and-epochs
  - ledger/control.py
- id: C-02
  title: etcd control plane
  phase: P1
  workstream: C
  size: M
  status: done
  depends_on:
  - C-01
  - F-02
  decisions:
  - D-03
  deliverables:
  - crates/control-plane
  acceptance:
  - Leases, epochs and fences are stored in etcd with compare-and-swap on epoch.
  - Nodes watch fences and install them; a node that cannot reach etcd stops renewing and loses its lease.
  - The trait's test suite passes against both implementations.
  refs:
  - docs/design.md#failover
- id: R-01
  title: Outbox relay and batched apply
  phase: P1
  workstream: R
  size: M
  status: done
  depends_on:
  - K-03
  deliverables:
  - crates/ledger-repl
  acceptance:
  - Entries ship per account in (epoch, seq) order and apply idempotently in batches, one round trip per
    batch.
  - A gap is buffered and re-fetched, never skipped; redelivery applies nothing twice.
  - Each home publishes a per-cell watermark even when idle.
  refs:
  - docs/design.md#replication
- id: R-02
  title: Fencing and quarantine on apply
  phase: P1
  workstream: R
  size: M
  status: done
  depends_on:
  - R-01
  - C-01
  deliverables:
  - crates/ledger-repl
  - crates/ledger-store/migrations
  acceptance:
  - The void rule from ledger/node.py is enforced in SQL on every node.
  - Entries from a superseded epoch beyond its cutoff move to quarantine, with the projection reversed,
    whether written locally or received.
  - Quarantined entries are never merged silently.
  refs:
  - docs/design.md#failover
  - ledger/node.py
- id: R-03
  title: Strong durability tier
  phase: P1
  workstream: R
  size: S
  status: done
  depends_on:
  - R-01
  deliverables:
  - crates/ledger-repl
  acceptance:
  - A strong write returns only after a remote cell has applied it; if no acknowledgement arrives in time,
    the caller gets durability_not_met and a retry with the same key completes it without double-posting.
  refs:
  - docs/design.md#durability-tiers
- id: C-03
  title: Failover orchestrator
  phase: P1
  workstream: C
  size: M
  status: done
  depends_on:
  - C-01
  - R-02
  deliverables:
  - crates/control-plane
  - crates/ledgerctl (promote, drain subcommands)
  acceptance:
  - Promotion reads the standby's high-water mark, issues epoch+1 with that cutoff and pushes the fence
    to every reachable node.
  - Draining routes new requests away from a cell without stopping in-flight commits.
  - Promotion of a level standby finishes inside 15 seconds on the local environment.
  refs:
  - docs/design.md#failover
