- id: S-07
  title: Credentialed workflows for the public repository
  phase: P1
  workstream: S
  size: M
  status: done
  depends_on:
  - S-05
  decisions:
  - D-16
  deliverables:
  - .github/workflows/infra-apply.yml
  - docs/credentialed-workflows.md
  acceptance:
  - Credentialed workflows run only by dispatch, never on a pull request, never with pull_request_target,
    from main only, in an environment that needs a named person's approval.
  - Each cloud trusts only that environment of that repository, and a test checks the trust subject written
    in the documentation.
  - A run never prints a plan, identifiers or outputs into a public log: the plan is kept in the private
      state store and the log holds counts only, with a test that fails if a step prints plan output.
  - Changes to .github/workflows need the owner's review, and actions are pinned to full commits.
  notes: A person must review it because it edits workflows that hold credentials. D-16 puts them on the
    public repository, where logs are public, so every guard here is required.
  refs:
  - docs/credentialed-workflows.md
