  - An internet-facing application load balancer in the edge subnets takes HTTPS on port 443 only, with a certificate from AWS Certificate Manager for a name the person gives, no port 80 listener, and
    a current TLS policy, shown by tests of the module.
  - It forwards to the API machine's port 8443 over HTTPS with its health check on /healthz, so a cell that is draining or not ready takes no traffic, shown by tests.
  - It takes connections only from the ranges in edge_client_cidrs. With none, no ingress rule is made, and a range of 0.0.0.0/0 or ::/0 is refused by validation until K-23d is done, shown by tests.
  - The API machine's group takes port 8443 from the load balancer's group for this path, and the load balancer's egress is that port to the API group and nothing else, shown by tests.
  - A web ACL with a rate limit for each address is attached, shown by tests.
  - The layer prints the DNS record the person must make to validate the certificate, and no account identifier, shown by a test of the outputs.
  notes: The load balancer does not check the machine's certificate, so the private authority's certificate on the machine still works behind it. Each cell has one API machine, so there is one target.
    Nothing is applied by an agent. A person reads the plan, supplies the name, makes the validation record and approves the apply.
