- id: I-01i
  title: Container image for self-hosted Postgres
  phase: P1
  workstream: I
  size: M
  status: done
  depends_on:
  - I-01d
  decisions:
  - D-02
  deliverables:
  - images/postgres
  - crates/node-agent
  acceptance:
  - One OCI image, built on the official PostgreSQL 16 image with no extra extensions, runs a cell node
    as primary or standby from a node configuration file. It runs as a non-root user, needs no privileged
    mode, and works on any container host that follows the OCI standard (Docker, Podman, Kubernetes).
  - A primary starts with TLS only, using a certificate from a mounted secret, sets synchronous_standby_names
    from the configuration, and creates the administrator's credential and hands it to a secret store
    behind a trait. A standby takes a base backup from the primary and joins by physical streaming replication.
    No logical replication slots are created.
  - A test against three real containers shows that a commit on the primary returns once one standby has
    it, still returns with one standby stopped, and waits with both stopped, and that data survives a
    restart of every node.
  - The image holds no password, key or certificate, shown by a scan of its layers in CI, and a node starts
    with no route to the internet.
  - The image is built and tested in CI. Publishing it needs registry credentials, so a person does that.
  notes: Asked for by Ust Oldfield on 2026-11-14, ideally run as a container inside a customer's own network.
    Automatic failover is not part of this task. Secret stores for the three clouds come in I-01ka.
