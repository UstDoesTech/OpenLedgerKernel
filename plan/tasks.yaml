  - docs/api-design.md
  acceptance:
  - Five failures from one address for one username lock that address out of that username for a minute, and the same username from another address is not locked, shown by tests. This replaces
    K-21's lock on the username alone, which would let anyone lock a person out from anywhere.
  - An address with many failures across different usernames is slowed for a minute, and the answer is the same 429 whether or not the username exists, shown by tests.
  - The client address is taken from the load balancer's forwarded header only when the connection comes from a range the service is told to trust, and from the connection otherwise, shown by tests, so a
    caller cannot choose its own address.
