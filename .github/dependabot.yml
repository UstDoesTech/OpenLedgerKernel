# Proposes updates. Dependabot's pull requests run with a read-only token and no secrets, and
# a person merges them after review. Workflow actions stay pinned to a full commit: Dependabot
# updates the commit and the version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /images/postgres
    schedule:
      interval: weekly
