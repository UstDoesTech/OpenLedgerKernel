name: Bug
description: Something does not behave as the design says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This issue is public. **Do not paste account, subscription, project or tenant identifiers, bucket or vault names, plan output, keys, tokens or personal data.** Replace them with placeholders. For a security problem, use private reporting instead.
  - type: textarea
    id: expected
    attributes:
      label: What the design or documentation says should happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened, and how to reproduce it
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where it ran
      description: Local three-node environment, or which clouds. No identifiers.
