name: infra-apply

# The only route for applying infrastructure from GitHub. Runbook: docs/credentialed-workflows.md.
#
# This repository is public, so everything here is built around one fact: anyone can read a
# workflow's log and its job summary. Nothing a person must keep private may reach either.
#
# - A person dispatches it, only from main, and only the repository's owner may. It never runs
#   from a push or a pull request, and never with pull_request_target. Agents never dispatch it.
# - It plans one layer of one environment, then (for "apply") waits for a person to approve the
#   `infra-apply` environment, plans again, refuses to go on if the plan is not the one that was
#   shown, and applies the saved plan.
# - Every tofu command's output goes to a log file (scripts/quiet.sh), never to the job's log.
#   The files, and the readable plan, are kept in a private plan store under this run's id
#   (scripts/keep_logs.sh). The job's log and summary hold only counts and a fingerprint.
# - No cloud secret is stored in GitHub. Each cloud trusts GitHub's identity token for the
#   environment the job runs in. The plan job uses read-only roles and never takes the state lock.
# - The plan file is never uploaded as an artifact. The JSON form of a plan holds raw sensitive
#   values, so it is read for its counts and then left on the runner, which is thrown away.
# - Both environments must be limited to main in the repository settings, so the code that runs
#   is always reviewed, merged code (see .github/CODEOWNERS).
#
# Third-party actions are pinned to a commit (the tag is in the comment).

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment under infra/envs, such as europe"
        required: true
        type: string
      layer:
        description: "Layer under that environment, such as network (infra/envs/<env>/<layer>)"
        required: true
        type: string
      replace:
        description: "Optional. Roll up to three machines of one cell, in order, comma-separated (a node or member with its index), keeping their data disks. Leave empty for a normal run."
        required: false
        default: ""
        type: string
      settle_minutes:
        description: "Minutes to wait after each rolled machine is healthy, before the next (0 to 30)."
        required: false
        default: "10"
        type: string
      action:
        description: "plan shows the counts. apply plans, waits for approval, then applies."
        required: true
        type: choice
        default: plan
        options: [plan, apply]

permissions:
  contents: read

# One run at a time for a layer: they share one state. Never cancel a run part-way.
concurrency:
  group: infra-${{ inputs.env }}-${{ inputs.layer }}
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "1"

jobs:
  plan:
    name: plan (read-only)
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: infra-plan
    permissions:
      contents: read
      id-token: write # to ask GitHub for the identity token each cloud trusts
    outputs:
      plan_sha: ${{ steps.plan.outputs.plan_sha }}
      later_shas: ${{ steps.later.outputs.later_shas }}
    env:
      INPUT_ENV: ${{ inputs.env }}
      INPUT_LAYER: ${{ inputs.layer }}
      INPUT_REPLACE: ${{ inputs.replace }}
      STATE_KEY_NAME: ${{ vars.TOFU_STATE_KEY_NAME || 'key' }}
      BACKEND_CONFIG: ${{ secrets.TOFU_BACKEND_CONFIG }}
      PLAN_STORE: ${{ secrets.PLAN_STORE }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_GCP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the inputs
        run: |
          set -euo pipefail
          re='^[a-z][a-z0-9-]{0,30}$'
          [[ "$INPUT_ENV" =~ $re ]] || { echo "::error::env must match $re"; exit 1; }
          [[ "$INPUT_LAYER" =~ $re ]] || { echo "::error::layer must match $re"; exit 1; }
          if [ -n "$INPUT_REPLACE" ]; then python3 scripts/replace_guard.py addresses "$INPUT_REPLACE"; fi
          dir="infra/envs/$INPUT_ENV/$INPUT_LAYER"
          [ -d "$dir" ] || { echo "::error::$dir does not exist"; exit 1; }
          [ -f "infra/envs/$INPUT_ENV/deployment.json" ] || { echo "::error::infra/envs/$INPUT_ENV/deployment.json is missing"; exit 1; }
          [ -n "$BACKEND_CONFIG" ] || { echo "::error::the variable TOFU_BACKEND_CONFIG is not set on this environment"; exit 1; }
          [[ "$PLAN_STORE" =~ ^s3://[a-z0-9.-]+(/[A-Za-z0-9._/-]*)?$ ]] || { echo "::error::the variable PLAN_STORE must be an s3:// address on this environment"; exit 1; }
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::the plan store is in AWS, so AWS_ROLE_ARN must be set on this environment"; exit 1; }
          echo "ROOT=$dir" >> "$GITHUB_ENV"
          echo "LOG_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
      - name: Region guard
        run: scripts/quiet.sh region-guard python3 scripts/check_uk_regions.py "infra/envs/$INPUT_ENV"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: AWS (federated)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 3600
      - name: Azure (federated)
        if: env.HAS_AZURE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Google Cloud (federated)
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Open the Azure Key Vault to this run
        id: keyvault
        if: env.HAS_AZURE == 'true' && env.HAS_VAULT == 'true'
        env:
          VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          VAULT_GROUP: ${{ secrets.AZURE_KEY_VAULT_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          # The vault's firewall stays on Deny. This run's own address is added for the run
          # and taken away again at the end (the last step), even if the run fails. The commands
          # print the vault's settings, so their output is dropped (-o none).
          ip=$(curl -fsS --max-time 20 https://api.ipify.org)
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::could not find this runner's address"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          az keyvault network-rule add --name "$VAULT" --resource-group "$VAULT_GROUP" --ip-address "$ip/32" --only-show-errors -o none
          sleep 45 # the firewall takes a short while to apply
      - name: Pass the TF_VAR_ secrets to OpenTofu
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os, uuid
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for name, value in json.loads(os.environ["ALL_SECRETS"]).items():
                  if name.startswith("TF_VAR_"):
                      # GitHub keeps secret names in capitals, and OpenTofu's variables are
                      # in lower case, so the part after the prefix is lower-cased.
                      name = "TF_VAR_" + name[len("TF_VAR_"):].lower()
                      end = "END_" + uuid.uuid4().hex
                      out.write(f"{name}<<{end}\n{value}\n{end}\n")
          PY
      - name: Initialise
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          printf '%s = "%s/%s"\n' "$STATE_KEY_NAME" "$INPUT_ENV" "$INPUT_LAYER" >> "$RUNNER_TEMP/backend.hcl"
          scripts/quiet.sh init tofu -chdir="$ROOT" init -no-color -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          # Read-only: no state lock. Nothing tofu says reaches this log.
          first="${INPUT_REPLACE%%,*}"
          replace_args=()
          if [ -n "$first" ]; then replace_args+=("-replace=$first"); fi
          scripts/quiet.sh plan tofu -chdir="$ROOT" plan -no-color -input=false -lock=false -out="$RUNNER_TEMP/tfplan" "${replace_args[@]}"
          scripts/quiet.sh plan-text bash -c 'tofu -chdir="$ROOT" show -no-color "$RUNNER_TEMP/tfplan" > "$LOG_DIR/plan.txt"'
          scripts/quiet.sh plan-json bash -c 'tofu -chdir="$ROOT" show -json "$RUNNER_TEMP/tfplan" > "$RUNNER_TEMP/plan.json"'
          if [ -n "$first" ]; then python3 scripts/replace_guard.py plan "$first" "$RUNNER_TEMP/plan.json"; fi
          sha=$(sha256sum "$LOG_DIR/plan.txt" | cut -d' ' -f1)
          echo "plan_sha=$sha" >> "$GITHUB_OUTPUT"
          {
            echo "## Plan for \`$INPUT_ENV/$INPUT_LAYER\`"
            echo
            python3 scripts/plan_counts.py "$RUNNER_TEMP/plan.json"
            echo
            echo "Plan fingerprint: \`$sha\`"
            echo
            echo "Run $GITHUB_RUN_ID. Read the plan in the private plan store, under this run's id, before you approve an apply."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Plan the rest of the roll
        id: later
        if: contains(env.INPUT_REPLACE, ',')
        run: |
          set -euo pipefail
          # Each later machine is planned now, against the state as it is, so the approver sees
          # and fingerprints every step. The apply job plans each again, just before it applies it.
          IFS=',' read -ra addrs <<< "$INPUT_REPLACE"
          shas=""
          for n in "${!addrs[@]}"; do
            [ "$n" -ge 1 ] || continue
            a="${addrs[$n]}"
            export n
            scripts/quiet.sh "plan-$n" tofu -chdir="$ROOT" plan -no-color -input=false -lock=false -out="$RUNNER_TEMP/tfplan-$n" "-replace=$a"
            scripts/quiet.sh "plan-text-$n" bash -c 'tofu -chdir="$ROOT" show -no-color "$RUNNER_TEMP/tfplan-$n" > "$LOG_DIR/plan-$n.txt"'
            scripts/quiet.sh "plan-json-$n" bash -c 'tofu -chdir="$ROOT" show -json "$RUNNER_TEMP/tfplan-$n" > "$RUNNER_TEMP/roll-$n.json"'
            python3 scripts/replace_guard.py plan "$a" "$RUNNER_TEMP/roll-$n.json"
            sha=$(sha256sum "$LOG_DIR/plan-$n.txt" | cut -d' ' -f1)
            shas="${shas:+$shas,}$sha"
            {
              echo
              echo "### Machine $((n + 1)) of ${#addrs[@]} in the roll"
              echo
              python3 scripts/plan_counts.py "$RUNNER_TEMP/roll-$n.json"
              echo
              echo "Plan fingerprint: \`$sha\`"
            } >> "$GITHUB_STEP_SUMMARY"
          done
          echo "later_shas=$shas" >> "$GITHUB_OUTPUT"
      - name: Keep the logs in the plan store
        if: always()
        run: scripts/keep_logs.sh plan
      - name: Close the Azure Key Vault again
        if: always() && steps.keyvault.outputs.ip != ''
        env:
          VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          VAULT_GROUP: ${{ secrets.AZURE_KEY_VAULT_RESOURCE_GROUP }}
          RUNNER_IP: ${{ steps.keyvault.outputs.ip }}
        run: |
          az keyvault network-rule remove --name "$VAULT" --resource-group "$VAULT_GROUP" --ip-address "$RUNNER_IP/32" --only-show-errors -o none \
            || echo "::warning::could not remove the runner's address from the Key Vault's firewall. Remove it by hand."

  apply:
    name: apply (needs approval)
    needs: plan
    if: inputs.action == 'apply' && github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 240 # VPN gateways take a long time; never cancel part-way
    environment: infra-apply
    permissions:
      contents: read
      id-token: write
    env:
      INPUT_ENV: ${{ inputs.env }}
      INPUT_LAYER: ${{ inputs.layer }}
      INPUT_REPLACE: ${{ inputs.replace }}
      STATE_KEY_NAME: ${{ vars.TOFU_STATE_KEY_NAME || 'key' }}
      BACKEND_CONFIG: ${{ secrets.TOFU_BACKEND_CONFIG }}
      PLAN_STORE: ${{ secrets.PLAN_STORE }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_GCP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME != '' }}
      REVIEWED_PLAN_SHA: ${{ needs.plan.outputs.plan_sha }}
      REVIEWED_LATER_SHAS: ${{ needs.plan.outputs.later_shas }}
      INPUT_SETTLE: ${{ inputs.settle_minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the inputs
        run: |
          set -euo pipefail
          re='^[a-z][a-z0-9-]{0,30}$'
          [[ "$INPUT_ENV" =~ $re ]] || { echo "::error::env must match $re"; exit 1; }
          [[ "$INPUT_LAYER" =~ $re ]] || { echo "::error::layer must match $re"; exit 1; }
          if [ -n "$INPUT_REPLACE" ]; then python3 scripts/replace_guard.py addresses "$INPUT_REPLACE"; fi
          dir="infra/envs/$INPUT_ENV/$INPUT_LAYER"
          [ -d "$dir" ] || { echo "::error::$dir does not exist"; exit 1; }
          [ -f "infra/envs/$INPUT_ENV/deployment.json" ] || { echo "::error::infra/envs/$INPUT_ENV/deployment.json is missing"; exit 1; }
          [ -n "$BACKEND_CONFIG" ] || { echo "::error::the variable TOFU_BACKEND_CONFIG is not set on this environment"; exit 1; }
          [[ "$PLAN_STORE" =~ ^s3://[a-z0-9.-]+(/[A-Za-z0-9._/-]*)?$ ]] || { echo "::error::the variable PLAN_STORE must be an s3:// address on this environment"; exit 1; }
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::the plan store is in AWS, so AWS_ROLE_ARN must be set on this environment"; exit 1; }
          [ -n "$REVIEWED_PLAN_SHA" ] || { echo "::error::the plan job gave no fingerprint"; exit 1; }
          [[ "$INPUT_SETTLE" =~ ^[0-9]{1,2}$ ]] && [ "$INPUT_SETTLE" -le 30 ] || { echo "::error::settle_minutes must be a whole number from 0 to 30"; exit 1; }
          echo "ROOT=$dir" >> "$GITHUB_ENV"
          echo "LOG_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
      - name: Region guard
        run: scripts/quiet.sh region-guard python3 scripts/check_uk_regions.py "infra/envs/$INPUT_ENV"
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: AWS (federated)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 14400
      - name: Azure (federated)
        if: env.HAS_AZURE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Google Cloud (federated)
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Open the Azure Key Vault to this run
        id: keyvault
        if: env.HAS_AZURE == 'true' && env.HAS_VAULT == 'true'
        env:
          VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          VAULT_GROUP: ${{ secrets.AZURE_KEY_VAULT_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          # The vault's firewall stays on Deny. This run's own address is added for the run
          # and taken away again at the end (the last step), even if the run fails. The commands
          # print the vault's settings, so their output is dropped (-o none).
          ip=$(curl -fsS --max-time 20 https://api.ipify.org)
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::could not find this runner's address"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          az keyvault network-rule add --name "$VAULT" --resource-group "$VAULT_GROUP" --ip-address "$ip/32" --only-show-errors -o none
          sleep 45 # the firewall takes a short while to apply
      - name: Pass the TF_VAR_ secrets to OpenTofu
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          python3 - <<'PY'
          import json, os, uuid
          with open(os.environ["GITHUB_ENV"], "a") as out:
              for name, value in json.loads(os.environ["ALL_SECRETS"]).items():
                  if name.startswith("TF_VAR_"):
                      # GitHub keeps secret names in capitals, and OpenTofu's variables are
                      # in lower case, so the part after the prefix is lower-cased.
                      name = "TF_VAR_" + name[len("TF_VAR_"):].lower()
                      end = "END_" + uuid.uuid4().hex
                      out.write(f"{name}<<{end}\n{value}\n{end}\n")
          PY
      - name: Initialise
        run: |
          set -euo pipefail
          printf '%s\n' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          printf '%s = "%s/%s"\n' "$STATE_KEY_NAME" "$INPUT_ENV" "$INPUT_LAYER" >> "$RUNNER_TEMP/backend.hcl"
          scripts/quiet.sh init tofu -chdir="$ROOT" init -no-color -input=false -backend-config="$RUNNER_TEMP/backend.hcl"
      - name: Plan again and check it is the plan that was shown
        run: |
          set -euo pipefail
          first="${INPUT_REPLACE%%,*}"
          replace_args=()
          if [ -n "$first" ]; then replace_args+=("-replace=$first"); fi
          scripts/quiet.sh replan tofu -chdir="$ROOT" plan -no-color -input=false -out="$RUNNER_TEMP/tfplan" "${replace_args[@]}"
          scripts/quiet.sh replan-text bash -c 'tofu -chdir="$ROOT" show -no-color "$RUNNER_TEMP/tfplan" > "$LOG_DIR/plan.txt"'
          sha=$(sha256sum "$LOG_DIR/plan.txt" | cut -d' ' -f1)
          if [ "$sha" != "$REVIEWED_PLAN_SHA" ]; then
            echo "::error::The plan changed since it was shown (reviewed $REVIEWED_PLAN_SHA, now $sha). Nothing was applied. Run the workflow again and read the new plan."
            exit 1
          fi
      - name: Apply the saved plan
        run: |
          set -euo pipefail
          # The output holds every resource's identifiers, so it goes to the log file. Only the
          # final line, which is made of numbers, is printed.
          scripts/quiet.sh apply tofu -chdir="$ROOT" apply -no-color -input=false "$RUNNER_TEMP/tfplan"
          grep -m1 -E '^Apply complete! Resources: [0-9]+ added, [0-9]+ changed, [0-9]+ destroyed\.$' "$LOG_DIR/apply.log" || true
      - name: Wait for the machine to be healthy
        if: env.INPUT_REPLACE != ''
        run: |
          set -euo pipefail
          first="${INPUT_REPLACE%%,*}"
          scripts/quiet.sh state-json-0 bash -c 'tofu -chdir="$ROOT" show -json > "$RUNNER_TEMP/state.json"'
          python3 scripts/roll_gate.py "$first" "$RUNNER_TEMP/state.json" --settle-minutes "$INPUT_SETTLE"
      - name: Roll the remaining machines, one at a time
        if: contains(env.INPUT_REPLACE, ',')
        run: |
          set -euo pipefail
          # Each machine is planned again just before it is applied. If the plan is not the one
          # the approver saw, or a machine is not healthy afterwards, the roll stops there.
          IFS=',' read -ra addrs <<< "$INPUT_REPLACE"
          IFS=',' read -ra reviewed <<< "$REVIEWED_LATER_SHAS"
          for n in "${!addrs[@]}"; do
            [ "$n" -ge 1 ] || continue
            a="${addrs[$n]}"
            export n
            scripts/quiet.sh "replan-$n" tofu -chdir="$ROOT" plan -no-color -input=false -out="$RUNNER_TEMP/tfplan-$n" "-replace=$a"
            scripts/quiet.sh "replan-text-$n" bash -c 'tofu -chdir="$ROOT" show -no-color "$RUNNER_TEMP/tfplan-$n" > "$LOG_DIR/plan-$n.txt"'
            scripts/quiet.sh "replan-json-$n" bash -c 'tofu -chdir="$ROOT" show -json "$RUNNER_TEMP/tfplan-$n" > "$RUNNER_TEMP/roll-$n.json"'
            python3 scripts/replace_guard.py plan "$a" "$RUNNER_TEMP/roll-$n.json"
            sha=$(sha256sum "$LOG_DIR/plan-$n.txt" | cut -d' ' -f1)
            if [ "$sha" != "${reviewed[$((n - 1))]}" ]; then
              echo "::error::The plan for machine $((n + 1)) changed since it was shown. The roll stopped before it. Earlier machines were rolled and checked."
              exit 1
            fi
            scripts/quiet.sh "apply-$n" tofu -chdir="$ROOT" apply -no-color -input=false "$RUNNER_TEMP/tfplan-$n"
            scripts/quiet.sh "state-json-$n" bash -c 'tofu -chdir="$ROOT" show -json > "$RUNNER_TEMP/state.json"'
            python3 scripts/roll_gate.py "$a" "$RUNNER_TEMP/state.json" --settle-minutes "$INPUT_SETTLE"
          done
      - name: Keep the logs in the plan store
        if: always()
        run: scripts/keep_logs.sh apply
      - name: Close the Azure Key Vault again
        if: always() && steps.keyvault.outputs.ip != ''
        env:
          VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          VAULT_GROUP: ${{ secrets.AZURE_KEY_VAULT_RESOURCE_GROUP }}
          RUNNER_IP: ${{ steps.keyvault.outputs.ip }}
        run: |
          az keyvault network-rule remove --name "$VAULT" --resource-group "$VAULT_GROUP" --ip-address "$RUNNER_IP/32" --only-show-errors -o none \
            || echo "::warning::could not remove the runner's address from the Key Vault's firewall. Remove it by hand."
