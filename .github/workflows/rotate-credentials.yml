name: rotate-credentials

# Issues and rotates each API machine's certificates and cell credentials, and writes them into
# that cell's API secret as a new version. Runbook: docs/runbooks/rotating-credentials.md. Rules
# for credentialed workflows: docs/credentialed-workflows.md.
#
# This repository is public, so everything here is built around one fact: anyone can read a
# workflow's log and its job summary. The rotation tool prints one line of counts. Everything else
# it learns (cells, addresses, secret references, the key, every certificate and credential) stays
# on the runner or in the clouds, and nothing the cloud tools say reaches this log.
#
# - A person dispatches it, only from main, and only the repository's owner may. It never runs from
#   a push, a pull request or a schedule, and agents never dispatch it.
# - The job waits for a person to approve the `rotate-credentials` environment.
# - No cloud secret is stored in GitHub. Each cloud trusts GitHub's identity token for that
#   environment. The AWS identity may sign with the authority's KMS key and write the API
#   secrets, and nothing more (see the runbook). A proving run may also read each cell's
#   administrator credential, and only to fill a database connection that is missing.
# - The tool is built from the reviewed code on main before any cloud sign-in, so what runs with
#   credentials is the code that was merged.
# - The authority's private key is never here. It is in KMS and signs on request.
# - The environment must be limited to main in the repository settings.
#
# Third-party actions are pinned to a commit (the tag is in the comment).

on:
  workflow_dispatch:
    inputs:
      env:
        description: "Environment under infra/envs, such as europe"
        required: true
        type: string
      kind:
        description: "all makes new certificates and credentials (the first run must be this). certificates or credentials makes only those. Run credentials when a cell is removed."
        required: true
        type: choice
        default: all
        options: [all, certificates, credentials]
      proving:
        description: "Only for a proving environment, which holds no real money or customer data. Lets the run fill a db.conn or tokens.json that is missing, from the cell's administrator credential, and leaves any that is there alone. Leave it off otherwise."
        required: false
        default: false
        type: boolean
      settle_secs:
        description: "How long to wait between the steps, so every machine and service has read the last one. 420 covers the 5 minute refresh and the service's 30 second check."
        required: false
        default: "420"
        type: string

permissions:
  contents: read

# One rotation at a time for everything. Never cancel one part-way.
concurrency:
  group: rotate-credentials
  cancel-in-progress: false

env:
  TOFU_VERSION: "1.10.0"
  TF_IN_AUTOMATION: "1"

jobs:
  rotate:
    name: rotate (needs approval)
    if: github.ref == 'refs/heads/main' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: rotate-credentials
    permissions:
      contents: read
      id-token: write # to ask GitHub for the identity token each cloud trusts
    env:
      INPUT_ENV: ${{ inputs.env }}
      INPUT_KIND: ${{ inputs.kind }}
      INPUT_SETTLE: ${{ inputs.settle_secs }}
      INPUT_PROVING: ${{ inputs.proving }}
      STATE_KEY_NAME: ${{ vars.TOFU_STATE_KEY_NAME || 'key' }}
      BACKEND_CONFIG: ${{ secrets.TOFU_BACKEND_CONFIG }}
      PLAN_STORE: ${{ secrets.PLAN_STORE }}
      AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
      HAS_AZURE: ${{ secrets.AZURE_CLIENT_ID != '' }}
      HAS_GCP: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the inputs
        run: |
          set -euo pipefail
          re='^[a-z][a-z0-9-]{0,30}$'
          [[ "$INPUT_ENV" =~ $re ]] || { echo "::error::env must match $re"; exit 1; }
          [[ "$INPUT_KIND" =~ ^(all|certificates|credentials)$ ]] || { echo "::error::kind is all, certificates or credentials"; exit 1; }
          [[ "$INPUT_PROVING" =~ ^(true|false)$ ]] || { echo "::error::proving is true or false"; exit 1; }
          [ -d "infra/envs/$INPUT_ENV/cells" ] || { echo "::error::infra/envs/$INPUT_ENV/cells does not exist"; exit 1; }
          [[ "$INPUT_SETTLE" =~ ^[0-9]{1,4}$ ]] || { echo "::error::settle_secs is a number of seconds"; exit 1; }
          [ -d "infra/envs/$INPUT_ENV/api" ] || { echo "::error::infra/envs/$INPUT_ENV/api does not exist"; exit 1; }
          [ -d "infra/envs/$INPUT_ENV/control-plane" ] || { echo "::error::infra/envs/$INPUT_ENV/control-plane does not exist"; exit 1; }
          [ -d "infra/envs/$INPUT_ENV/authority" ] || { echo "::error::infra/envs/$INPUT_ENV/authority does not exist"; exit 1; }
          [ -n "$BACKEND_CONFIG" ] || { echo "::error::the variable TOFU_BACKEND_CONFIG is not set on this environment"; exit 1; }
          [[ "$PLAN_STORE" =~ ^s3://[a-z0-9.-]+(/[A-Za-z0-9._/-]*)?$ ]] || { echo "::error::the variable PLAN_STORE must be an s3:// address on this environment"; exit 1; }
          [ -n "$AWS_ROLE_ARN" ] || { echo "::error::the authority is in AWS, so AWS_ROLE_ARN must be set on this environment"; exit 1; }
          if [ "$HAS_AZURE" = true ] && [ "$HAS_VAULT" != true ]; then
            echo "::warning::Azure is set but AZURE_KEY_VAULT_NAME is not, so the run will not open the Key Vault's firewall. If the vault's firewall is on Deny, the run will stop reading its secret"
          fi
          echo "LOG_DIR=$RUNNER_TEMP/logs" >> "$GITHUB_ENV"
      - name: Build the rotation tool from this commit
        # Before any cloud sign-in, so nothing that builds can reach a credential.
        run: cargo build --locked --release -p pki --quiet
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}
          tofu_wrapper: false
      - name: AWS (federated)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
      - name: Azure (federated)
        if: env.HAS_AZURE == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Google Cloud (federated)
        if: env.HAS_GCP == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Open the Azure Key Vault to this run
        id: keyvault
        if: env.HAS_AZURE == 'true' && env.HAS_VAULT == 'true'
        env:
          VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          VAULT_GROUP: ${{ secrets.AZURE_KEY_VAULT_RESOURCE_GROUP }}
        run: |
          set -euo pipefail
          # The vault's firewall stays on Deny. This run's own address is added for the run
          # and taken away again at the end (the last step), even if the run fails. The commands
          # print the vault's settings, so their output is dropped (-o none).
          ip=$(curl -fsS --max-time 20 https://api.ipify.org)
          [[ "$ip" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]] || { echo "::error::could not find this runner's address"; exit 1; }
          echo "ip=$ip" >> "$GITHUB_OUTPUT"
          az keyvault network-rule add --name "$VAULT" --resource-group "$VAULT_GROUP" --ip-address "$ip/32" --only-show-errors -o none
          sleep 45 # the firewall takes a short while to apply
      - name: Read where the cells and the authority are
        run: |
          set -euo pipefail
          # Only the state is read. Every output goes to a file that stays on this runner.
          umask 077
          printf '%s\n' "$BACKEND_CONFIG" > "$RUNNER_TEMP/backend.hcl"
          # The cells' layer is always read: it says where each self-hosted database machine's
          # certificates go, and, for a proving run, where each cell's own database is. So is the
          # control plane's: it says where each etcd member is and where its certificates go (K-18).
          layers="api authority cells control-plane"
          for layer in $layers; do
            cp "$RUNNER_TEMP/backend.hcl" "$RUNNER_TEMP/backend-$layer.hcl"
            printf '%s = "%s/%s"\n' "$STATE_KEY_NAME" "$INPUT_ENV" "$layer" >> "$RUNNER_TEMP/backend-$layer.hcl"
            dir="infra/envs/$INPUT_ENV/$layer"
            scripts/quiet.sh "init-$layer" tofu -chdir="$dir" init -no-color -input=false -backend-config="$RUNNER_TEMP/backend-$layer.hcl"
            scripts/quiet.sh "output-$layer" bash -c 'tofu -chdir="$1" output -json -no-color > "$2"' _ "$dir" "$RUNNER_TEMP/$layer-outputs.json"
          done
          extra=("$RUNNER_TEMP/cells-outputs.json")
          [ "$INPUT_PROVING" = true ] && extra+=(proving)
          # Last: the script takes this option after the positional words.
          extra+=(--etcd "$RUNNER_TEMP/control-plane-outputs.json")
          scripts/quiet.sh manifest python3 scripts/rotation_manifest.py "$RUNNER_TEMP/api-outputs.json" "$RUNNER_TEMP/authority-outputs.json" "$RUNNER_TEMP/manifest.json" "${extra[@]}"
      - name: Rotate
        id: rotate
        run: |
          set -euo pipefail
          # The tool prints one line of numbers, and on failure the name of a step. It never prints a
          # cell, an address, a secret reference, the key, a certificate or a credential, and the
          # cloud tools' own output stays inside it. Nothing else is printed here.
          line=$(target/release/ledger-pki rotate --manifest "$RUNNER_TEMP/manifest.json" --kind "$INPUT_KIND" --settle-secs "$INPUT_SETTLE" --work "$RUNNER_TEMP/pki")
          echo "$line"
          {
            echo "## Rotation (\`$INPUT_KIND\`)"
            echo
            echo "$line"
            echo
            echo "Run $GITHUB_RUN_ID."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove what the run kept on the runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/manifest.json" "$RUNNER_TEMP/pki" "$RUNNER_TEMP"/*-outputs.json
      - name: Keep the logs in the plan store
        if: always()
        run: scripts/keep_logs.sh rotate
      - name: Close the Azure Key Vault again
        if: always() && steps.keyvault.outputs.ip != ''
        env:
          VAULT: ${{ secrets.AZURE_KEY_VAULT_NAME }}
          VAULT_GROUP: ${{ secrets.AZURE_KEY_VAULT_RESOURCE_GROUP }}
          RUNNER_IP: ${{ steps.keyvault.outputs.ip }}
        run: |
          az keyvault network-rule remove --name "$VAULT" --resource-group "$VAULT_GROUP" --ip-address "$RUNNER_IP/32" --only-show-errors -o none \
            || echo "::warning::could not remove the runner's address from the Key Vault's firewall. Remove it by hand."
